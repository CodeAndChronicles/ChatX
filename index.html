<script type="module">
    import { auth, db, rtdb, startPresence, parsePresence, buildSearchKeywords, createUserProfile, convIdFor } from "./firebase-config.js";
    import { onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { 
        collection, doc, getDoc, getDocs, query, where, orderBy, onSnapshot, serverTimestamp,
        updateDoc, increment, limit, startAfter, writeBatch, runTransaction,
        arrayUnion, arrayRemove, FieldPath
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
    import { 
        ref, set, remove, onValue, onDisconnect,
        serverTimestamp as rtServerTimestamp 
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // ========== STATE ==========
    let currentUser = null;
    let currentUserData = null;
    let activeChatId = null;
    let activeChatUser = null;
    let chat = null;                       // controller of the open chat (listeners + rendered messages)
    let stopPresence = null;
    let conversationsUnsubscribe = null;
    let renderSeq = 0;
    let lastMessageTime = 0;
    let searchTimer = null;

    const SPAM_COOLDOWN = 1000;
    const EDIT_WINDOW = 15 * 60 * 1000;
    const PAGE_SIZE = 30;                  // messages per page
    const TYPING_TTL = 6000;               // a typing flag older than this is considered stale
    const USER_TTL = 5 * 60 * 1000;        // profile cache lifetime
    let editingMessageId = null;
    let replyingTo = null;

    const userCache = new Map();           // uid -> { data, at }   (avoids N+1 reads)
    const conversationsCache = new Map();  // convId -> latest conversation data
    const deliveredHandled = new Set();    // message ids already marked delivered this session
    
    // ========== DOM Elements ==========
    const $ = (id) => document.getElementById(id);
    const sidebar = $('sidebar');
    const overlay = $('sidebar-overlay');
    const welcomeScreen = $('welcome-screen');
    const chatScreen = $('chat-screen');
    const searchInput = $('search-input');
    const searchResults = $('search-results');
    const conversationsList = $('conversations-list');
    const messagesContainer = $('messages-container');
    const messageInput = $('message-input');
    const sendBtn = $('send-btn');
    const charCounter = $('char-counter');
    const MAX_CHARS = 500;

    // ========== Helper Functions ==========
    function formatShortTime(date) {
        if (!date) return '';
        const now = new Date();
        const diff = (now - date) / 1000;
        if (diff < 60) return 'now';
        if (diff < 3600) return Math.floor(diff / 60) + 'm';
        if (date.toDateString() === now.toDateString()) {
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        }
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (date.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return date.toLocaleDateString([], { day: 'numeric', month: 'short' });
    }

    function escapeHtml(text) {
        if (!text) return '';
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function closeSidebarMobile() {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }

    function showModal(modal) { modal.classList.add('show'); }
    function hideModal(modal) { modal.classList.remove('show'); }

    // ========== Safe Unsubscribe ==========
    function safeUnsubscribe(fn) {
        if (fn && typeof fn === 'function') {
            try {
                fn();
            } catch(e) {
                console.warn('Error in unsubscribe:', e);
            }
        }
    }

    // ========== RTDB watcher registry ==========
    // One underlying listener per path, shared by every consumer (ref-counted).
    // Makes duplicate presence/typing listeners impossible.
    const rtdbWatchers = new Map();
    function watchPath(path, cb) {
        let w = rtdbWatchers.get(path);
        if (!w) {
            w = { cbs: new Set(), last: null, ready: false, unsub: null };
            const emit = (v) => { w.last = v; w.ready = true; w.cbs.forEach(fn => fn(v)); };
            w.unsub = onValue(ref(rtdb, path), (snap) => emit(snap.val()), (err) => {
                console.warn('RTDB watch error:', path, err);
                emit(null);
            });
            rtdbWatchers.set(path, w);
        }
        w.cbs.add(cb);
        if (w.ready) cb(w.last);
        return () => {
            w.cbs.delete(cb);
            if (w.cbs.size === 0) {
                safeUnsubscribe(w.unsub);
                if (rtdbWatchers.get(path) === w) rtdbWatchers.delete(path);
            }
        };
    }

    let serverOffset = 0;
    watchPath('.info/serverTimeOffset', (v) => { serverOffset = Number(v) || 0; });

    // ========== Presence System (RTDB) ==========
    // presence/{uid} = { connections: {id:true}, lastSeen }  (written by startPresence in firebase-config.js)
    function watchUserStatus(userId, callback) {
        if (!userId) return () => {};
        return watchPath(`presence/${userId}`, (v) => callback(parsePresence(v)));
    }

    // ========== Typing System (RTDB) ==========
    // typing/{convId}/{uid} = { ts }  - removed on stop, on conversation switch and via onDisconnect.
    const typingSent = { convId: null, active: false, lastWrite: 0, stopTimer: null };

    function setTyping(convId, isTyping) {
        if (!convId || !currentUser) return;
        const typingRef = ref(rtdb, `typing/${convId}/${currentUser.uid}`);
        clearTimeout(typingSent.stopTimer);

        if (isTyping) {
            const now = Date.now();
            if (!typingSent.active || typingSent.convId !== convId || now - typingSent.lastWrite > 2500) {
                if (typingSent.active && typingSent.convId !== convId) setTyping(typingSent.convId, false);
                typingSent.convId = convId;
                typingSent.active = true;
                typingSent.lastWrite = now;
                onDisconnect(typingRef).remove().catch(() => {});
                set(typingRef, { ts: rtServerTimestamp() }).catch(() => {});
            }
            typingSent.stopTimer = setTimeout(() => setTyping(convId, false), 3000);
        } else if (typingSent.active && typingSent.convId === convId) {
            typingSent.active = false;
            remove(typingRef).catch(() => {});
            onDisconnect(typingRef).cancel().catch(() => {});
        }
    }

    function watchTyping(conversationId, userId, callback) {
        if (!conversationId || !userId) return () => {};
        let expiry = null;
        const off = watchPath(`typing/${conversationId}/${userId}`, (v) => {
            clearTimeout(expiry);
            const ts = v && (v.ts || v.timestamp);
            const age = ts ? (Date.now() + serverOffset - ts) : Infinity;
            const fresh = !!v && age < TYPING_TTL;
            callback(fresh);
            // a crashed sender can't clear its flag: expire it locally
            if (fresh) expiry = setTimeout(() => callback(false), Math.max(TYPING_TTL - age, 0) + 50);
        });
        return () => { clearTimeout(expiry); off(); };
    }

    // ========== Seen / unread ==========
    const pendingSeen = new Set();

    async function flushSeen() {
        if (!chat || !currentUser || document.visibilityState !== 'visible') return;
        const c = chat;
        const unread = ((conversationsCache.get(c.convId) || {}).unread || {})[currentUser.uid] || 0;
        const ids = [...pendingSeen].slice(0, 400);
        if (!ids.length && (!unread || Date.now() - (c.lastUnreadClear || 0) < 3000)) return;
        ids.forEach(id => pendingSeen.delete(id));
        c.lastUnreadClear = Date.now();
        try {
            const batch = writeBatch(db);
            ids.forEach(id => batch.update(
                doc(db, 'conversations', c.convId, 'messages', id),
                { delivered: true, seen: true, seenAt: serverTimestamp() }
            ));
            batch.update(doc(db, 'conversations', c.convId), { [`unread.${currentUser.uid}`]: 0 });
            await batch.commit();
        } catch (e) {
            ids.forEach(id => pendingSeen.add(id)); // retried on reconnect / visibility
            console.warn('Error marking conversation seen:', e);
        }
    }

    // Older unseen messages that are outside the loaded page (needs composite index seen+senderId, same as V1).
    async function catchUpSeen(c) {
        const unread = ((conversationsCache.get(c.convId) || {}).unread || {})[currentUser.uid] || 0;
        if (!unread || unread <= pendingSeen.size) return;
        try {
            const snap = await getDocs(query(
                collection(db, 'conversations', c.convId, 'messages'),
                where('seen', '==', false), where('senderId', '!=', currentUser.uid), limit(100)
            ));
            if (c !== chat) return;
            snap.forEach(d => pendingSeen.add(d.id));
            flushSeen();
        } catch (e) { console.warn('catchUpSeen failed:', e); }
    }

    // Recipient app received the newest message while the chat is not open -> delivered.
    function markDelivered(conv) {
        const lm = conv.lastMessage;
        if (!lm || typeof lm !== 'object' || !lm.id || lm.senderId === currentUser.uid) return;
        if (conv.id === activeChatId || deliveredHandled.has(lm.id)) return;
        if (!((conv.unread || {})[currentUser.uid] > 0)) return;
        deliveredHandled.add(lm.id);
        updateDoc(doc(db, 'conversations', conv.id, 'messages', lm.id), { delivered: true, deliveredAt: serverTimestamp() })
            .catch(() => deliveredHandled.delete(lm.id));
    }

    // ========== Scroll to Message ==========
    function scrollToMessage(msgId) {
        const target = document.querySelector(`[data-msg-id="${msgId}"]`);
        if (target) {
            target.scrollIntoView({ behavior: 'smooth', block: 'center' });
            target.style.backgroundColor = 'rgba(124, 58, 237, 0.2)';
            setTimeout(() => {
                target.style.backgroundColor = '';
            }, 1500);
        }
    }

    // ========== Update Send Button ==========
    function updateSendButton() {
        if (sendBtn) sendBtn.disabled = messageInput.value.trim().length === 0;
    }

    function updateCharCounter() {
        const len = messageInput.value.length;
        if (len > MAX_CHARS - 50) {
            charCounter.style.display = 'block';
            charCounter.textContent = `${len}/${MAX_CHARS}`;
            charCounter.style.color = len > MAX_CHARS ? 'var(--danger)' : 'var(--text-muted)';
            if (len > MAX_CHARS) {
                messageInput.value = messageInput.value.substring(0, MAX_CHARS);
            }
        } else {
            charCounter.style.display = 'none';
        }
        updateSendButton();
    }

    if (messageInput) {
        messageInput.addEventListener('input', updateCharCounter);
        messageInput.addEventListener('input', updateSendButton);
        updateSendButton();
    }

    // ========== Theme ==========
    const savedTheme = localStorage.getItem('nova-theme') || 'dark';
    if (savedTheme === 'light') document.body.classList.add('light-theme');
    
    const themeBtn = $('theme-btn');
    if (themeBtn) {
        themeBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-theme');
            localStorage.setItem('nova-theme', document.body.classList.contains('light-theme') ? 'light' : 'dark');
        });
    }

    // ========== Mobile Navigation ==========
    const menuBtn = $('menu-btn');
    if (menuBtn) {
        menuBtn.addEventListener('click', () => {
            sidebar.classList.add('open');
            overlay.classList.add('show');
        });
    }
    
    if (overlay) {
        overlay.addEventListener('click', () => {
            sidebar.classList.remove('open');
            overlay.classList.remove('show');
        });
    }
    
    const backBtn = $('back-btn');
    if (backBtn) backBtn.addEventListener('click', closeChat);

    const settingsBtn = $('settings-btn');
    if (settingsBtn) {
        settingsBtn.addEventListener('click', () => {
            window.location.href = "settings.html";
        });
    }
    
    const navSettings = $('nav-settings');
    if (navSettings) {
        navSettings.addEventListener('click', () => {
            window.location.href = "settings.html";
        });
    }
    
    const navChats = $('nav-chats');
    if (navChats) {
        navChats.addEventListener('click', () => {
            if (window.innerWidth <= 768) {
                sidebar.classList.add('open');
                overlay.classList.add('show');
            }
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            navChats.classList.add('active');
        });
    }

    // ========== Modals ==========
    const userModal = $('user-modal');
    const editModal = $('edit-modal');
    const editMsgModal = $('edit-msg-modal');
    
    if (userModal) userModal.addEventListener('click', (e) => { if (e.target === userModal) hideModal(userModal); });
    if (editModal) editModal.addEventListener('click', (e) => { if (e.target === editModal) hideModal(editModal); });
    if (editMsgModal) editMsgModal.addEventListener('click', (e) => { if (e.target === editMsgModal) hideModal(editMsgModal); });

    // ========== Authentication ==========
    onAuthStateChanged(auth, async (user) => {
        if (!user) {
            teardownAll();
            window.location.href = "auth.html";
            return;
        }
        currentUser = user;
        
        const snap = await getDoc(doc(db, "users", user.uid));
        currentUserData = snap.exists() ? snap.data() : await createUserProfile(user);
        if (!Array.isArray(currentUserData.pinnedChats)) currentUserData.pinnedChats = [];

        if (stopPresence) stopPresence();
        stopPresence = startPresence(user.uid);   // re-registers itself on every reconnect
        updateSelfUI();
        listenToConversations();
        runMigration(user);
        
        if (Notification.permission === 'default') {
            Notification.requestPermission();
        }
    });

    // V1 -> V2 data migration: background, idempotent (see migration-old-version.js)
    async function runMigration(user) {
        try {
            const m = await import('./migration-old-version.js');
            const res = await m.migrateCurrentUser(user);
            if (res && res.profileChanged) {
                const s = await getDoc(doc(db, "users", user.uid));
                if (s.exists()) { currentUserData = { pinnedChats: [], ...s.data() }; updateSelfUI(); }
            }
        } catch (e) {
            console.warn('Migration will retry on next login:', e);
        }
    }

    function teardownAll() {
        teardownChat();
        safeUnsubscribe(conversationsUnsubscribe);
        conversationsUnsubscribe = null;
        for (const unsub of sidebarWatchers.values()) safeUnsubscribe(unsub);
        sidebarWatchers.clear();
        if (stopPresence) { stopPresence(); stopPresence = null; }
    }

    function updateSelfUI() {
        const selfName = $('self-name');
        const selfAvatar = $('self-avatar');
        const editAvatar = $('edit-avatar');
        const editUsernameDisplay = $('edit-username-display');
        const editName = $('edit-name');
        const editBio = $('edit-bio');
        
        if (selfName) selfName.textContent = currentUserData.displayName;
        if (selfAvatar) selfAvatar.textContent = currentUserData.displayName.charAt(0).toUpperCase();
        if (editAvatar) editAvatar.textContent = currentUserData.displayName.charAt(0).toUpperCase();
        if (editUsernameDisplay) editUsernameDisplay.textContent = '@' + currentUserData.username;
        if (editName) editName.value = currentUserData.displayName || '';
        if (editBio) editBio.value = currentUserData.bio || '';
    }

    // ========== Search Users ==========
    function displaySearchResults(results) {
        if (!searchResults) return;
        searchResults.innerHTML = '';
        if (results.length === 0) {
            searchResults.innerHTML = '<div style="padding:14px;text-align:center;color:var(--text-muted);font-size:13px;">No users found</div>';
            return;
        }
        
        results.forEach(u => {
            const div = document.createElement('div');
            div.className = 'chat-item';
            div.innerHTML = `
                <div class="avatar sm">${u.displayName.charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div class="name">${escapeHtml(u.displayName)}</div>
                    <div class="preview">@${escapeHtml(u.username)}</div>
                </div>
            `;
            div.addEventListener('click', async () => {
                if (searchInput) searchInput.value = '';
                if (searchResults) searchResults.innerHTML = '';
                await startChat(u);
                if (window.innerWidth <= 768) closeSidebarMobile();
            });
            searchResults.appendChild(div);
        });
    }

    if (searchInput) {
        searchInput.addEventListener('input', () => {
            clearTimeout(searchTimer);
            const term = searchInput.value.trim().toLowerCase();
            if (!term || term.length < 2) {
                if (searchResults) searchResults.innerHTML = '';
                return;
            }
            
            searchTimer = setTimeout(async () => {
                try {
                    const q = query(
                        collection(db, 'users'),
                        where('searchKeywords', 'array-contains', term),
                        limit(10)
                    );
                    const snap = await getDocs(q);
                    const results = [];
                    snap.forEach(d => {
                        if (d.data().uid !== currentUser.uid) results.push(d.data());
                    });
                    displaySearchResults(results);
                } catch (e) {
                    console.error("Search error:", e);
                }
            }, 350);
        });
    }

    // ========== Conversations List ==========
    function otherIdOf(conv) {
        return (conv.participants || []).find(id => id !== currentUser.uid);
    }

    // Profiles are cached: a conversation update no longer re-reads every other user (N+1).
    async function getUserProfile(uid) {
        const hit = userCache.get(uid);
        if (hit && Date.now() - hit.at < USER_TTL) return hit.data;
        const snap = await getDoc(doc(db, "users", uid));
        const data = snap.exists() ? snap.data() : null;
        userCache.set(uid, { data, at: Date.now() });
        return data;
    }

    function otherUserFor(uid) {
        const hit = userCache.get(uid);
        return (hit && hit.data) || { uid, displayName: 'Deleted user', username: 'deleted', bio: '', deleted: true };
    }

    function previewText(conv) {
        const lm = conv.lastMessage;
        if (!lm) return 'Start chatting...';
        const type = typeof lm === 'object' ? (lm.type || 'text') : 'text';
        if (type !== 'text') return { image: 'Photo', video: 'Video', audio: 'Voice message', file: 'File' }[type] || '';
        return (typeof lm === 'object' ? lm.text : lm) || 'Start chatting...';   // V1 stored a plain string
    }

    // Sidebar presence/typing watchers: diffed against the current list, never duplicated.
    const presenceState = new Map();   // otherUid -> online
    const sidebarTyping = new Map();   // convId -> typing
    const sidebarWatchers = new Map(); // key -> unsubscribe

    function paintPresence(otherId) {
        conversationsList.querySelectorAll('.chat-item').forEach(item => {
            if (item.dataset.otherId !== otherId) return;
            const av = item.querySelector('.avatar');
            if (av) av.classList.toggle('online', !!presenceState.get(otherId));
        });
    }

    function paintTyping(convId) {
        conversationsList.querySelectorAll('.chat-item').forEach(item => {
            if (item.dataset.convId !== convId) return;
            const previewDiv = item.querySelector('.preview');
            if (!previewDiv) return;
            const typing = !!sidebarTyping.get(convId);
            previewDiv.textContent = typing ? 'typing...' : (item.dataset.preview || '');
            previewDiv.classList.toggle('typing', typing);
        });
    }

    function syncSidebarWatchers(docs) {
        const want = new Map();
        docs.forEach(conv => {
            const otherId = otherIdOf(conv);
            if (!otherId || otherUserFor(otherId).deleted) return;
            want.set(`p:${otherId}`, () => watchUserStatus(otherId, (s) => { presenceState.set(otherId, s.isOnline); paintPresence(otherId); }));
            want.set(`t:${conv.id}`, () => watchTyping(conv.id, otherId, (t) => { sidebarTyping.set(conv.id, t); paintTyping(conv.id); }));
        });
        for (const [key, unsub] of sidebarWatchers) {
            if (!want.has(key)) {
                safeUnsubscribe(unsub);
                sidebarWatchers.delete(key);
                if (key.startsWith('t:')) sidebarTyping.delete(key.slice(2));
                else presenceState.delete(key.slice(2));
            }
        }
        for (const [key, start] of want) {
            if (!sidebarWatchers.has(key)) sidebarWatchers.set(key, start());
        }
    }

    function renderConversations(docs) {
        const pinnedIds = currentUserData.pinnedChats || [];
        const pinned = docs.filter(d => pinnedIds.includes(d.id));
        const unpinned = docs.filter(d => !pinnedIds.includes(d.id));

        conversationsList.innerHTML = '';

        if (docs.length === 0) {
            conversationsList.innerHTML = `<div style="padding:24px;text-align:center;color:var(--text-muted);font-size:13px;">
                <iconify-icon icon="mdi:message-text-outline" style="font-size:36px;opacity:0.3;display:block;margin:0 auto 8px;"></iconify-icon>
                No conversations yet
            </div>`;
            return;
        }

        for (const conv of [...pinned, ...unpinned]) {
            const otherId = otherIdOf(conv);
            if (!otherId) continue;
            const otherUser = otherUserFor(otherId);

            const item = document.createElement('div');
            item.className = `chat-item ${conv.id === activeChatId ? 'active' : ''}`;
            if (pinnedIds.includes(conv.id)) item.classList.add('pinned');
            item.dataset.convId = conv.id;
            item.dataset.otherId = otherId;

            const lastMsg = previewText(conv);
            const truncated = lastMsg.length > 25 ? lastMsg.substring(0, 25) + '...' : lastMsg;
            item.dataset.preview = truncated;
            const lastTime = conv.updatedAt?.toDate ? formatShortTime(conv.updatedAt.toDate()) : '';
            const unreadCount = conv.unread?.[currentUser.uid] || 0;
            const isOnline = !!presenceState.get(otherId);
            const isTyping = !!sidebarTyping.get(conv.id);

            item.innerHTML = `
                <div class="avatar ${isOnline ? 'online' : ''}">${escapeHtml(otherUser.displayName || 'U').charAt(0).toUpperCase()}</div>
                <div class="chat-info">
                    <div style="display:flex;justify-content:space-between;align-items:center;">
                        <div class="name">${pinnedIds.includes(conv.id) ? '<iconify-icon icon="mdi:pin" class="pin-icon"></iconify-icon> ' : ''}${escapeHtml(otherUser.displayName)}</div>
                        <div style="font-size:10px;color:var(--text-muted);flex-shrink:0;">${lastTime}</div>
                    </div>
                    <div class="preview ${isTyping ? 'typing' : ''}">${isTyping ? 'typing...' : escapeHtml(truncated)}</div>
                </div>
                ${unreadCount > 0 && conv.id !== activeChatId ? `<div class="unread-badge">${unreadCount > 99 ? '99+' : unreadCount}</div>` : ''}
            `;

            item.addEventListener('click', () => {
                openChat(conv.id, otherUserFor(otherId));
                if (window.innerWidth <= 768) closeSidebarMobile();
            });

            conversationsList.appendChild(item);
        }
    }

    function listenToConversations() {
        if (conversationsUnsubscribe) {
            safeUnsubscribe(conversationsUnsubscribe);
            conversationsUnsubscribe = null;
        }

        const q = query(
            collection(db, "conversations"),
            where("participants", "array-contains", currentUser.uid),
            orderBy("updatedAt", "desc")
        );

        conversationsUnsubscribe = onSnapshot(q, async (snapshot) => {
            if (!conversationsList) return;
            const token = ++renderSeq;

            const docs = snapshot.docs.map(d => ({ id: d.id, ...d.data({ serverTimestamps: 'estimate' }) }));
            docs.forEach(c => conversationsCache.set(c.id, c));

            // only profiles that are not cached cost a read; fetched in parallel
            const ids = [...new Set(docs.map(otherIdOf).filter(Boolean))];
            await Promise.all(ids.map(id => getUserProfile(id).catch(() => null)));
            if (token !== renderSeq) return;   // a newer snapshot already took over

            renderConversations(docs);
            syncSidebarWatchers(docs);
            docs.forEach(markDelivered);
        }, (error) => {
            console.error("Conversations error:", error);
        });
    }

    // ========== Pin Chat ==========
    async function togglePinChat(convId) {
        const pinned = currentUserData.pinnedChats || [];
        const index = pinned.indexOf(convId);
        if (index > -1) pinned.splice(index, 1);
        else pinned.unshift(convId);
        await updateDoc(doc(db, "users", currentUser.uid), { pinnedChats: pinned });
        currentUserData.pinnedChats = pinned;
    }

    const pinChatBtn = $('pin-chat-btn');
    if (pinChatBtn) {
        pinChatBtn.addEventListener('click', async () => {
            if (activeChatId) {
                await togglePinChat(activeChatId);
                const icon = pinChatBtn.querySelector('iconify-icon');
                const isPinned = currentUserData.pinnedChats?.includes(activeChatId);
                if (icon) icon.setAttribute('icon', isPinned ? 'mdi:pin' : 'mdi:pin-outline');
            }
        });
    }

    // ========== Start Chat ==========
    async function startChat(otherUser) {
        const convId = convIdFor(currentUser.uid, otherUser.uid);
        const convRef = doc(db, "conversations", convId);

        // atomic create-if-missing: never overwrites unread/lastMessage of an existing conversation
        await runTransaction(db, async (tx) => {
            const snap = await tx.get(convRef);
            if (snap.exists()) return;
            tx.set(convRef, {
                participants: [currentUser.uid, otherUser.uid],
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp(),
                lastMessage: null,   // { id, text, type, senderId, timestamp }
                unread: { [currentUser.uid]: 0, [otherUser.uid]: 0 },
                sentCount: { [currentUser.uid]: 0, [otherUser.uid]: 0 },
                schemaVersion: 2
            });
        });

        openChat(convId, otherUser);
    }

    // ========== Create Message Element ==========
    function createMessageElement(msgDoc, msg, isMine, otherUser) {
        const el = document.createElement('div');
        el.className = `msg ${isMine ? 'out' : 'in'}`;
        el.dataset.msgId = msgDoc.id;

        const text = typeof msg.text === 'string' ? msg.text : '';
        const pending = !!(msgDoc.metadata && msgDoc.metadata.hasPendingWrites);
        const time = msg.timestamp?.toDate ? msg.timestamp.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';

        let statusIcon = '';
        if (isMine) {
            if (pending) statusIcon = '<iconify-icon icon="mdi:clock-outline" class="msg-status sent"></iconify-icon>';   // not confirmed by the server yet
            else if (msg.seen) statusIcon = '<iconify-icon icon="mdi:check-all" class="msg-status seen"></iconify-icon>';
            else if (msg.delivered) statusIcon = '<iconify-icon icon="mdi:check-all" class="msg-status delivered"></iconify-icon>';
            else statusIcon = '<iconify-icon icon="mdi:check" class="msg-status sent"></iconify-icon>';
        }

        const reactionEntries = Object.entries(msg.reactions || {}).filter(([, users]) => Array.isArray(users) && users.length > 0);

        let quoteHtml = '';
        if (msg.replyTo) {
            const qText = String(msg.replyTo.text || '');
            quoteHtml = `<div class="quote">
                <iconify-icon icon="mdi:reply" style="font-size:10px;"></iconify-icon>
                ${escapeHtml(msg.replyTo.senderName || '')}: ${escapeHtml(qText.substring(0, 50))}${qText.length > 50 ? '...' : ''}
            </div>`;
        }

        // only "text" is rendered today; other types are reserved for future media support
        const bodyHtml = (!msg.type || msg.type === 'text') ? escapeHtml(text) : '<em>Unsupported message</em>';

        el.innerHTML = `
            <div class="msg-bubble">
                ${quoteHtml}
                ${bodyHtml}
                ${msg.edited ? '<div class="msg-edited">edited</div>' : ''}
            </div>
            ${reactionEntries.length ? '<div class="msg-reactions"></div>' : ''}
            <div class="msg-time">
                ${time}
                ${statusIcon}
            </div>
        `;

        const reactionsDiv = el.querySelector('.msg-reactions');
        if (reactionsDiv) {
            reactionEntries.forEach(([emoji, users]) => {
                const span = document.createElement('span');
                span.textContent = `${emoji} ${users.length}`;
                span.title = users.join(', ');
                span.addEventListener('click', () => window.addReaction(msgDoc.id, emoji));
                reactionsDiv.appendChild(span);
            });
        }

        const quoteDiv = el.querySelector('.quote');
        if (quoteDiv && msg.replyTo?.id) {
            quoteDiv.addEventListener('click', () => scrollToMessage(msg.replyTo.id));
        }

        const tsMs = pending ? 0 : msg.timestamp?.toDate?.()?.getTime();   // pending messages can't be edited yet
        el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            showContextMenu(e, msgDoc.id, text, isMine, tsMs);
        });
        
        let pressTimer;
        el.addEventListener('touchstart', (e) => {
            pressTimer = setTimeout(() => {
                showContextMenu(e, msgDoc.id, text, isMine, tsMs);
            }, 500);
        });
        el.addEventListener('touchend', () => clearTimeout(pressTimer));
        el.addEventListener('touchmove', () => clearTimeout(pressTimer));

        let touchStartX = 0;
        el.addEventListener('touchstart', (e) => {
            touchStartX = e.touches[0].clientX;
        }, { passive: true });
        el.addEventListener('touchend', (e) => {
            const diff = e.changedTouches[0].clientX - touchStartX;
            if (diff > 60 && !isMine) {
                el.style.transform = 'translateX(8px)';
                setTimeout(() => { el.style.transform = ''; }, 150);
                replyingTo = { id: msgDoc.id, text: text, senderName: isMine ? 'You' : otherUser.displayName };
                const replyWho = $('reply-who');
                const replyWhat = $('reply-what');
                const replyBar = $('reply-bar');
                if (replyWho) replyWho.textContent = `Replying to ${replyingTo.senderName}`;
                if (replyWhat) replyWhat.textContent = text.length > 60 ? text.substring(0, 60) + '...' : text;
                if (replyBar) replyBar.style.display = 'flex';
                if (messageInput) messageInput.focus();
            }
        }, { passive: true });

        el.addEventListener('dblclick', () => {
            window.addReaction(msgDoc.id, '❤️');
        });

        return el;
    }

    // ========== Message list rendering (incremental) ==========
    const tsOf = (data) => (data.timestamp && data.timestamp.toMillis) ? data.timestamp.toMillis() : Date.now();

    function dayLabel(ts) {
        const d = new Date(ts);
        const now = new Date();
        const yesterday = new Date(now);
        yesterday.setDate(yesterday.getDate() - 1);
        if (d.toDateString() === now.toDateString()) return 'Today';
        if (d.toDateString() === yesterday.toDateString()) return 'Yesterday';
        return d.toLocaleDateString([], { weekday: 'long', month: 'short', day: 'numeric' });
    }

    // Only moves date dividers; message elements are never recreated here.
    function normalizeDividers() {
        if (!messagesContainer) return;
        messagesContainer.querySelectorAll('.date-divider').forEach(d => d.remove());
        let lastDay = '';
        messagesContainer.querySelectorAll('.msg').forEach(el => {
            if (el.dataset.day !== lastDay) {
                lastDay = el.dataset.day;
                const divider = document.createElement('div');
                divider.className = 'date-divider';
                divider.textContent = dayLabel(Number(el.dataset.ts));
                el.before(divider);
            }
        });
    }

    function insertSorted(el, ts) {
        const msgs = messagesContainer.querySelectorAll('.msg');
        for (let i = msgs.length - 1; i >= 0; i--) {
            if (Number(msgs[i].dataset.ts) <= ts) { msgs[i].after(el); return; }
        }
        if (msgs.length) msgs[0].before(el); else messagesContainer.appendChild(el);
    }

    // returns 'added' | 'modified'
    function upsertMessage(c, d) {
        const data = d.data({ serverTimestamps: 'estimate' });   // pending writes get an estimated timestamp
        const ts = tsOf(data);
        const el = createMessageElement(d, data, data.senderId === currentUser.uid, c.otherUser);
        el.dataset.ts = ts;
        el.dataset.day = new Date(ts).toDateString();
        c.store.set(d.id, { id: d.id, data, ts });

        const old = c.els.get(d.id);
        c.els.set(d.id, el);
        if (old && old.isConnected) {
            el.dataset.day = old.dataset.day;
            el.dataset.ts = old.dataset.ts;    // keep position and original timestamp on edit/reaction/ack
            old.replaceWith(el);
            return 'modified';
        }
        insertSorted(el, ts);
        return 'added';
    }

    function removeMessage(c, id) {
        const el = c.els.get(id);
        if (el) el.remove();
        c.els.delete(id);
        c.store.delete(id);
    }

    function handleSnapshot(c, snap, kind) {
        if (c !== chat || !messagesContainer) return;
        const nearBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight < 160;
        const prevHeight = messagesContainer.scrollHeight;
        // the live window is limited to PAGE_SIZE: docs that merely slide out of it are NOT deletions
        const windowOldest = (kind === 'live' && snap.docs.length >= PAGE_SIZE)
            ? tsOf(snap.docs[snap.docs.length - 1].data({ serverTimestamps: 'estimate' })) : null;

        let structural = false, appendedTail = false, appendedMine = false, insertedTop = false;

        snap.docChanges().forEach((change) => {
            const d = change.doc;
            if (change.type === 'removed') {
                if (windowOldest !== null && tsOf(d.data({ serverTimestamps: 'estimate' })) <= windowOldest) return;
                if (c.els.has(d.id)) { removeMessage(c, d.id); structural = true; }
                return;
            }
            const data = d.data({ serverTimestamps: 'estimate' });
            const ts = tsOf(data);
            const result = upsertMessage(c, d);
            if (result === 'added') {
                structural = true;
                if (ts >= c.newestTs) { c.newestTs = ts; appendedTail = true; if (data.senderId === currentUser.uid) appendedMine = true; }
                else insertedTop = true;
            }
            if (data.senderId !== currentUser.uid && !data.seen && !(d.metadata && d.metadata.hasPendingWrites)) {
                pendingSeen.add(d.id);
            }
        });

        if (structural) normalizeDividers();

        if (kind === 'live') {
            if (!c.firstLoadDone) {
                c.firstLoadDone = true;
                messagesContainer.scrollTo({ top: messagesContainer.scrollHeight, behavior: 'instant' });
            } else if (appendedTail && (nearBottom || appendedMine)) {
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            }
            if (!c.pagingInit && (snap.docs.length || !snap.metadata.fromCache)) {
                c.pagingInit = true;
                c.oldestDoc = snap.docs.length ? snap.docs[snap.docs.length - 1] : null;
                c.hasMore = snap.docs.length >= PAGE_SIZE;
                catchUpSeen(c);
            }
        } else if (insertedTop) {
            messagesContainer.scrollTo({ top: messagesContainer.scrollTop + messagesContainer.scrollHeight - prevHeight, behavior: 'instant' });   // keep the viewport anchored
        }

        if (pendingSeen.size) flushSeen();
        if (c.hasMore && messagesContainer.scrollHeight <= messagesContainer.clientHeight) loadOlder(c);
    }

    // Older pages: one bounded listener per page (each read once), cleaned with the chat.
    function loadOlder(c) {
        if (c !== chat || c.loadingOlder || !c.hasMore || !c.oldestDoc) return;
        c.loadingOlder = true;
        let first = true;
        const q = query(
            collection(db, "conversations", c.convId, "messages"),
            orderBy("timestamp", "desc"), startAfter(c.oldestDoc), limit(PAGE_SIZE)
        );
        c.unsubs.push(onSnapshot(q, (snap) => {
            handleSnapshot(c, snap, 'older');
            if (first) {
                first = false;
                if (snap.docs.length) c.oldestDoc = snap.docs[snap.docs.length - 1];
                c.hasMore = snap.docs.length >= PAGE_SIZE;
                c.loadingOlder = false;
            }
        }, (err) => {
            console.error('Older messages error:', err);
            c.loadingOlder = false;
        }));
    }

    if (messagesContainer) {
        messagesContainer.addEventListener('scroll', () => {
            if (chat && messagesContainer.scrollTop < 120) loadOlder(chat);
        }, { passive: true });
    }

    // ========== Open Chat ==========
    function teardownChat() {
        if (typingSent.active) setTyping(typingSent.convId, false);
        if (chat) chat.unsubs.forEach(safeUnsubscribe);
        chat = null;
        pendingSeen.clear();
        activeChatId = null;
        activeChatUser = null;
    }

    function openChat(convId, otherUser) {
        if (!convId || !otherUser || !otherUser.uid) {
            console.error('openChat: invalid parameters', { convId, otherUser });
            return;
        }
        // re-opening the same conversation must not stack listeners
        if (chat && chat.convId === convId) {
            if (messageInput) messageInput.focus();
            return;
        }
        teardownChat();

        activeChatId = convId;
        activeChatUser = otherUser;
        const c = chat = {
            convId, otherUser, unsubs: [], els: new Map(), store: new Map(),
            oldestDoc: null, hasMore: false, loadingOlder: false,
            pagingInit: false, firstLoadDone: false, newestTs: 0, lastUnreadClear: 0
        };
        
        document.body.classList.add('chat-open');

        if (welcomeScreen) welcomeScreen.style.display = 'none';
        if (chatScreen) chatScreen.style.display = 'flex';
        if (messagesContainer) messagesContainer.innerHTML = '';

        const chatAvatar = $('chat-avatar');
        const chatName = $('chat-name');
        
        if (chatAvatar) chatAvatar.textContent = (otherUser.displayName || 'U').charAt(0).toUpperCase();
        if (chatName) chatName.textContent = otherUser.displayName;

        let online = false, typing = false;
        const paintStatus = () => {
            const statusEl = $('chat-status');
            if (!statusEl) return;
            if (typing) { statusEl.textContent = 'typing...'; statusEl.className = 'status-text typing'; }
            else if (online) { statusEl.textContent = 'Online'; statusEl.className = 'status-text online'; }
            else { statusEl.textContent = 'Offline'; statusEl.className = 'status-text offline'; }
        };
        paintStatus();
        if (!otherUser.deleted) {
            c.unsubs.push(watchUserStatus(otherUser.uid, (s) => { online = s.isOnline; paintStatus(); }));
            c.unsubs.push(watchTyping(convId, otherUser.uid, (t) => { typing = t; paintStatus(); }));
        }

        // draft (or a message that was sent but never acknowledged before the page closed)
        const draft = localStorage.getItem(`draft_${convId}`) || localStorage.getItem(`unsent_${convId}`) || '';
        if (messageInput) messageInput.value = draft;
        if (messageInput) messageInput.focus();
        updateSendButton();
        updateCharCounter();

        document.querySelectorAll('#conversations-list .chat-item').forEach(item => {
            item.classList.toggle('active', item.dataset.convId === convId);
        });

        const isPinned = currentUserData.pinnedChats?.includes(convId);
        const pinIcon = pinChatBtn?.querySelector('iconify-icon');
        if (pinIcon) pinIcon.setAttribute('icon', isPinned ? 'mdi:pin' : 'mdi:pin-outline');

        // latest page, realtime. includeMetadataChanges -> pending (clock) -> confirmed transition is observable.
        const liveQuery = query(
            collection(db, "conversations", convId, "messages"),
            orderBy("timestamp", "desc"), limit(PAGE_SIZE)
        );
        c.unsubs.push(onSnapshot(liveQuery, { includeMetadataChanges: true },
            (snap) => handleSnapshot(c, snap, 'live'),
            (err) => console.error('Messages listener error:', err)
        ));
    }

    // ========== Context Menu ==========
    function showContextMenu(e, msgId, text, isMine, timestamp) {
        const existing = document.querySelector('.context-menu');
        if (existing) existing.remove();
        
        const menu = document.createElement('div');
        menu.className = 'context-menu';
        
        let x = e.clientX, y = e.clientY;
        if (e.touches) { x = e.touches[0].clientX; y = e.touches[0].clientY; }
        
        document.body.appendChild(menu);
        
        const rect = menu.getBoundingClientRect();
        let left = x, top = y;
        if (left + rect.width > window.innerWidth) left = window.innerWidth - rect.width - 10;
        if (top + rect.height > window.innerHeight) top = window.innerHeight - rect.height - 10;
        if (left < 10) left = 10;
        if (top < 10) top = 10;
        
        menu.style.left = left + 'px';
        menu.style.top = top + 'px';
        
        const replyBtn = document.createElement('button');
        replyBtn.innerHTML = '<iconify-icon icon="mdi:reply"></iconify-icon> Reply';
        replyBtn.onclick = () => {
            replyingTo = { id: msgId, text: text, senderName: isMine ? 'You' : activeChatUser?.displayName };
            const replyWho = $('reply-who');
            const replyWhat = $('reply-what');
            const replyBar = $('reply-bar');
            if (replyWho) replyWho.textContent = `Replying to ${replyingTo.senderName}`;
            if (replyWhat) replyWhat.textContent = text.length > 60 ? text.substring(0, 60) + '...' : text;
            if (replyBar) replyBar.style.display = 'flex';
            menu.remove();
            if (messageInput) messageInput.focus();
        };
        menu.appendChild(replyBtn);
        
        const copyBtn = document.createElement('button');
        copyBtn.innerHTML = '<iconify-icon icon="mdi:content-copy"></iconify-icon> Copy';
        copyBtn.onclick = () => { navigator.clipboard.writeText(text); menu.remove(); };
        menu.appendChild(copyBtn);
        
        if (isMine) {
            const now = Date.now();
            if (now - (timestamp || 0) < EDIT_WINDOW) {
                const editBtn = document.createElement('button');
                editBtn.innerHTML = '<iconify-icon icon="mdi:pencil"></iconify-icon> Edit';
                editBtn.onclick = () => {
                    editingMessageId = msgId;
                    const editMsgInput = $('edit-msg-input');
                    if (editMsgInput) editMsgInput.value = text;
                    showModal(editMsgModal);
                    menu.remove();
                };
                menu.appendChild(editBtn);
            }
            const deleteBtn = document.createElement('button');
            deleteBtn.className = 'danger';
            deleteBtn.innerHTML = '<iconify-icon icon="mdi:delete"></iconify-icon> Delete';
            deleteBtn.onclick = () => {
                if (confirm('Delete this message?')) deleteMessage(msgId);
                menu.remove();
            };
            menu.appendChild(deleteBtn);
        }
        
        const reactionsRow = document.createElement('div');
        reactionsRow.style.display = 'flex';
        reactionsRow.style.gap = '8px';
        reactionsRow.style.padding = '8px';
        reactionsRow.style.borderTop = '1px solid var(--border-color)';
        reactionsRow.style.marginTop = '4px';
        const emojis = ['❤️', '😂', '🔥', '👍', '😮', '🎉'];
        emojis.forEach(emoji => {
            const reactionBtn = document.createElement('button');
            reactionBtn.innerHTML = `<span style="font-size:20px;">${emoji}</span>`;
            reactionBtn.style.flex = '1';
            reactionBtn.style.justifyContent = 'center';
            reactionBtn.onclick = () => { window.addReaction(msgId, emoji); menu.remove(); };
            reactionsRow.appendChild(reactionBtn);
        });
        menu.appendChild(reactionsRow);
        
        const removeMenu = (e) => {
            if (!menu.contains(e.target)) menu.remove();
            document.removeEventListener('click', removeMenu);
            document.removeEventListener('touchstart', removeMenu);
        };
        setTimeout(() => {
            document.addEventListener('click', removeMenu);
            document.addEventListener('touchstart', removeMenu);
        }, 100);
    }

    function closeChat() {
        teardownChat();
        replyingTo = null;
        
        const replyBar = $('reply-bar');
        if (replyBar) replyBar.style.display = 'none';
        
        if (welcomeScreen) welcomeScreen.style.display = 'flex';
        if (chatScreen) chatScreen.style.display = 'none';
        if (messagesContainer) messagesContainer.innerHTML = '';
        
        document.body.classList.remove('chat-open');
        document.querySelectorAll('#conversations-list .chat-item.active').forEach(i => i.classList.remove('active'));
    }

    // ========== Send Message ==========
    async function sendMessage() {
        const text = messageInput.value.trim();
        if (!text) return;

        const now = Date.now();
        if (now - lastMessageTime < SPAM_COOLDOWN) {
            if (sendBtn) sendBtn.classList.add('shake');
            setTimeout(() => {
                if (sendBtn) sendBtn.classList.remove('shake');
            }, 300);
            return;
        }
        lastMessageTime = now;

        if (!activeChatId && activeChatUser) await startChat(activeChatUser);
        if (!activeChatId || !activeChatUser) return;
        if (activeChatUser.deleted) { alert('This account was deleted. You can no longer send messages here.'); return; }

        const convId = activeChatId;
        const other = activeChatUser;
        const me = currentUser.uid;
        const reply = replyingTo ? { id: replyingTo.id, text: replyingTo.text || '', senderName: replyingTo.senderName || '' } : null;

        // client-generated id: a retry/replay of the same write can never create a second message
        const msgRef = doc(collection(db, "conversations", convId, "messages"));
        const messageData = {
            senderId: me,
            type: "text",
            text: text,
            timestamp: serverTimestamp(),
            edited: false,
            editedAt: null,
            replyTo: reply,
            reactions: {},
            delivered: false,
            deliveredAt: null,
            seen: false,
            seenAt: null
        };

        // The input is cleared right away, but the text is kept in localStorage until the SERVER confirms the write.
        // The bubble shows a clock icon (pending) until then.
        localStorage.setItem(`unsent_${convId}`, text);
        localStorage.removeItem(`draft_${convId}`);
        if (messageInput) messageInput.value = '';
        replyingTo = null;
        const replyBar = $('reply-bar');
        if (replyBar) replyBar.style.display = 'none';
        updateSendButton();
        updateCharCounter();
        setTyping(convId, false);

        try {
            const batch = writeBatch(db);   // message + conversation metadata commit atomically
            batch.set(msgRef, messageData);
            batch.update(doc(db, "conversations", convId), {
                lastMessage: { id: msgRef.id, text: text, type: "text", senderId: me, timestamp: serverTimestamp() },
                updatedAt: serverTimestamp(),
                [`unread.${other.uid}`]: increment(1),
                [`sentCount.${me}`]: increment(1)
            });
            await batch.commit();   // resolves only after the server acknowledged (hangs while offline, then completes)
            localStorage.removeItem(`unsent_${convId}`);
        } catch (e) {
            console.error('Send failed:', e);
            localStorage.removeItem(`unsent_${convId}`);
            if (activeChatId === convId && messageInput && !messageInput.value) {
                messageInput.value = text;
                localStorage.setItem(`draft_${convId}`, text);
            } else {
                localStorage.setItem(`draft_${convId}`, text);
            }
            updateSendButton();
            updateCharCounter();
        }
        if (messageInput) messageInput.focus();
    }

    if (sendBtn) sendBtn.addEventListener('click', sendMessage);
    if (messageInput) {
        messageInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });
        
        messageInput.addEventListener('input', () => {
            if (!activeChatId) return;
            setTyping(activeChatId, messageInput.value.trim().length > 0);
            if (messageInput.value) localStorage.setItem(`draft_${activeChatId}`, messageInput.value);
            else localStorage.removeItem(`draft_${activeChatId}`);
        });
    }

    // Back online / tab visible again: retry anything that could not be written while away.
    window.addEventListener('online', flushSeen);
    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible') flushSeen();
    });

    const cancelReply = $('cancel-reply');
    if (cancelReply) {
        cancelReply.addEventListener('click', () => {
            replyingTo = null;
            const replyBar = $('reply-bar');
            if (replyBar) replyBar.style.display = 'none';
        });
    }

    // ========== Emoji Picker ==========
    const emojiBtn = $('emoji-btn');
    if (emojiBtn) {
        emojiBtn.addEventListener('click', () => {
            const existing = document.querySelector('.emoji-picker');
            if (existing) { existing.remove(); return; }
            const picker = document.createElement('div');
            picker.className = 'emoji-picker';
            const emojis = ['😀', '😂', '😍', '🔥', '👍', '❤️', '🎉', '✨', '😢', '😎', '🥺', '🤣', '💀', '👋', '🙏', '💯'];
            emojis.forEach(emoji => {
                const span = document.createElement('span');
                span.textContent = emoji;
                span.onclick = () => {
                    if (messageInput) messageInput.value += emoji;
                    updateSendButton();
                    updateCharCounter();
                    picker.remove();
                    if (messageInput) messageInput.focus();
                };
                picker.appendChild(span);
            });
            document.body.appendChild(picker);
            const removePicker = (e) => {
                if (!picker.contains(e.target)) picker.remove();
                document.removeEventListener('click', removePicker);
                document.removeEventListener('touchstart', removePicker);
            };
            setTimeout(() => {
                document.addEventListener('click', removePicker);
                document.addEventListener('touchstart', removePicker);
            }, 100);
        });
    }

    // ========== Reactions ==========
    // Atomic arrayUnion/arrayRemove on reactions.<emoji>: no read-modify-write, no lost updates.
    window.addReaction = async function(msgId, emoji) {
        if (!chat || !currentUser) return;
        const entry = chat.store.get(msgId);
        if (!entry) return;
        const has = ((entry.data.reactions || {})[emoji] || []).includes(currentUser.uid);
        try {
            await updateDoc(
                doc(db, "conversations", chat.convId, "messages", msgId),
                new FieldPath('reactions', emoji),
                has ? arrayRemove(currentUser.uid) : arrayUnion(currentUser.uid)
            );
        } catch (e) { console.warn('Reaction failed:', e); }
    };

    // ========== Delete Message ==========
    async function deleteMessage(msgId) {
        if (!chat || !currentUser) return;
        const c = chat;
        const me = currentUser.uid;
        const entry = c.store.get(msgId);
        const batch = writeBatch(db);
        batch.delete(doc(db, "conversations", c.convId, "messages", msgId));

        const upd = {};
        if (entry && entry.data.senderId === me) upd[`sentCount.${me}`] = increment(-1);
        const lm = (conversationsCache.get(c.convId) || {}).lastMessage;
        if (lm && typeof lm === 'object' && lm.id === msgId) {
            const prev = [...c.store.values()].filter(m => m.id !== msgId).sort((a, b) => a.ts - b.ts).pop();
            upd.lastMessage = prev ? {
                id: prev.id,
                text: (!prev.data.type || prev.data.type === 'text') ? (prev.data.text || '') : '',
                type: prev.data.type || 'text',
                senderId: prev.data.senderId,
                timestamp: prev.data.timestamp || null
            } : null;
        }
        if (Object.keys(upd).length) batch.update(doc(db, "conversations", c.convId), upd);
        try { await batch.commit(); } catch (e) { console.warn('Delete failed:', e); }
    }

    // ========== Edit Message ==========
    // Same document id, original timestamp untouched; only text + edit metadata change.
    const editMsgSave = $('edit-msg-save');
    if (editMsgSave) {
        editMsgSave.addEventListener('click', async () => {
            const newTextInput = $('edit-msg-input');
            const newText = newTextInput ? newTextInput.value.trim() : '';
            if (!newText || !editingMessageId || !chat) return;
            const c = chat;
            const msgId = editingMessageId;
            const entry = c.store.get(msgId);
            hideModal(editMsgModal);
            editingMessageId = null;
            if (!entry || entry.data.senderId !== currentUser.uid) return;
            if (Date.now() - entry.ts > EDIT_WINDOW + 60 * 1000) return;   // edit window elapsed while the dialog was open
            if (newText === entry.data.text) return;

            try {
                const batch = writeBatch(db);
                batch.update(doc(db, "conversations", c.convId, "messages", msgId), {
                    text: newText,
                    edited: true,
                    editedAt: serverTimestamp()
                });
                const lm = (conversationsCache.get(c.convId) || {}).lastMessage;
                if (lm && typeof lm === 'object' && lm.id === msgId) {
                    batch.update(doc(db, "conversations", c.convId), { 'lastMessage.text': newText });
                }
                await batch.commit();
            } catch (e) { console.warn('Edit failed:', e); }
        });
    }

    const editMsgCancel = $('edit-msg-cancel');
    if (editMsgCancel) {
        editMsgCancel.addEventListener('click', () => {
            hideModal(editMsgModal);
            editingMessageId = null;
        });
    }

    // ========== User Info ==========
    function showUserInfo(userData) {
        const userAvatar = $('user-avatar');
        const userName = $('user-name');
        const userUsername = $('user-username');
        const userEmail = $('user-email');
        const userBio = $('user-bio');
        const userUid = $('user-uid');
        const userCreated = $('user-created');
        const userLastseen = $('user-lastseen');
        
        if (userAvatar) userAvatar.textContent = (userData.displayName || 'U').charAt(0).toUpperCase();
        if (userName) userName.textContent = userData.displayName || 'Unknown';
        if (userUsername) userUsername.textContent = '@' + (userData.username || 'user');
        if (userEmail) userEmail.textContent = userData.email || '-';
        if (userBio) userBio.textContent = userData.bio || 'No bio yet';
        if (userUid) userUid.textContent = userData.uid || '-';
        if (userCreated) userCreated.textContent = userData.createdAt?.toDate ? userData.createdAt.toDate().toLocaleDateString() : '-';
        if (userLastseen) userLastseen.textContent = userData.lastLogin?.toDate ? userData.lastLogin.toDate().toLocaleString() : 'Recently';
        showModal(userModal);
    }

    const userCloseBtn = $('user-close-btn');
    if (userCloseBtn) userCloseBtn.addEventListener('click', () => hideModal(userModal));
    
    const chatAvatar = $('chat-avatar');
    if (chatAvatar) chatAvatar.addEventListener('click', () => { if (activeChatUser) showUserInfo(activeChatUser); });
    
    const chatInfoBtn = $('chat-info-btn');
    if (chatInfoBtn) chatInfoBtn.addEventListener('click', () => { if (activeChatUser) showUserInfo(activeChatUser); });

    // ========== Edit Profile ==========
    const profileSection = $('profile-section');
    if (profileSection) {
        profileSection.addEventListener('click', () => {
            const editName = $('edit-name');
            const editBio = $('edit-bio');
            if (editName) editName.value = currentUserData.displayName || '';
            if (editBio) editBio.value = currentUserData.bio || '';
            showModal(editModal);
        });
    }

    const editCancel = $('edit-cancel');
    if (editCancel) editCancel.addEventListener('click', () => hideModal(editModal));

    const editSave = $('edit-save');
    if (editSave) {
        editSave.addEventListener('click', async () => {
            const editName = $('edit-name');
            const editBio = $('edit-bio');
            const newName = editName ? editName.value.trim() : '';
            const newBio = editBio ? editBio.value.trim() : '';
            if (!newName) { alert('Name cannot be empty'); return; }
            const userRef = doc(db, "users", currentUser.uid);
            await updateDoc(userRef, {
                displayName: newName,
                bio: newBio,
                searchKeywords: buildSearchKeywords(currentUserData.username, newName)
            });
            currentUserData = { ...currentUserData, displayName: newName, bio: newBio };
            updateSelfUI();
            hideModal(editModal);
        });
    }

    // ========== Logout ==========
    const logoutBtn = $('logout-btn');
    if (logoutBtn) {
        logoutBtn.addEventListener('click', async () => {
            if (!confirm('Sign out?')) return;
            teardownChat();
            if (stopPresence) { await stopPresence(); stopPresence = null; }
            await signOut(auth);
            window.location.href = "auth.html";
        });
    }

    // ========== Cleanup on page unload ==========
    // Presence is cleaned server-side by onDisconnect (see startPresence); here we only drop listeners / typing.
    window.addEventListener('beforeunload', () => {
        if (typingSent.active) setTyping(typingSent.convId, false);
        safeUnsubscribe(conversationsUnsubscribe);
        if (chat) chat.unsubs.forEach(safeUnsubscribe);
        for (const unsub of sidebarWatchers.values()) safeUnsubscribe(unsub);
    });

    console.log('NovaChat V2 ready');
</script>
</body>
